name: My First CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  basic-job:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Current Directory
        run: pwd

      - name: List Files
        run: ls -la

      - name: Make Directory
        run: mkdir MyFolder

      - name: Echo Message
        run: echo "I am learning Github Actions, Written by Jaweria Khan"
